aid: j-hilburn
name: J Hilburn
description: 'J.Hilburn is a Dallas, Texas based direct-to-consumer custom menswear
  brand founded in 2007. It designs and sells made-to-measure suits, shirts, trousers,
  polos and outerwear through a network of roughly 1,000 independent personal stylists
  and a small number of studio spaces rather than traditional retail stores. Its public
  technology surface is consumer- and stylist-facing rather than developer-facing:
  a catalog and checkout storefront at jhilburn.com, a stylist recruiting and training
  site at stylist.jhilburn.com, and two iOS applications, J.Hilburn Stylist and J.Hilburn
  VMA (Virtual Measuring App). J.Hilburn publishes no developer portal, no API reference
  and no machine-readable API description; the only API surfaces evident from the public
  web are private, undocumented internal endpoints that the company''s own robots.txt
  disallows crawlers from reaching.'
